name: Deploy to GoDaddy

# Uploads the site to GoDaddy shared hosting over FTP on every push to main.
# Only changed files are transferred (the action keeps a hash-state file on the server).
#
# Required repo secrets (Settings -> Secrets and variables -> Actions -> New repository secret):
#   FTP_SERVER    - FTP host from cPanel -> FTP Accounts -> "Configure FTP Client"
#                   (e.g. ftp.kreativeadditions.org or the server hostname GoDaddy shows)
#   FTP_USERNAME  - full FTP username (often looks like user@kreativeadditions.org)
#   FTP_PASSWORD  - that FTP account's password
#
# Optional repo variable (same screen, "Variables" tab):
#   FTP_SERVER_DIR - target folder on the server, must end with "/".
#                    Defaults to "public_html/". Set it to "./" if your FTP
#                    account is already scoped to public_html.
#
# If the run fails with a TLS/certificate error, change `protocol: ftps` to `protocol: ftp`.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-godaddy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site files
        run: |
          mkdir dist
          cp -r *.html .htaccess css js assets dist/

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
